<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="manifest" href="manifest.json?v=3">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tip Split</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: #f4f6f8;
  padding: 16px;
}

section {
  background: #fff;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 16px;
}

h2 {
  margin-top: 0;
  font-size: 18px;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin: 6px 0;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button {
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  background: #007aff;
  color: white;
  margin-top: 8px;
}

.result {
  font-weight: bold;
  margin-top: 8px;
}
</style>
</head>

<body>

<!-- 총 팁 -->
<section>
  <h2>총 팁 금액</h2>
  <input id="totalTip" type="number" inputmode="decimal" placeholder="총 팁 금액" />
</section>

<!-- 층별 팁 -->
<section>
  <h2>층별 팁</h2>
  <input id="floor1" type="number" inputmode="decimal" placeholder="1층 팁" />
  <input id="floor2" type="number" inputmode="decimal" placeholder="2층 팁" />
  <input id="floor3" type="number" inputmode="decimal" placeholder="3층 팁" />
</section>

<!-- 퍼센트 분배 -->
<section>
  <h2>퍼센트로 나누기 (5명)</h2>
  <div id="percentInputs"></div>
  <div id="percentResult" class="result"></div>
</section>

<!-- 사람 수 분배 -->
<section>
  <h2>사람 수로 나누기 (5명)</h2>
  <input id="peopleCount" type="number" inputmode="numeric" placeholder="사람 수" />
  <div id="peopleResult" class="result"></div>
</section>

<!-- 시간 분배 -->
<section>
  <h2>시간 기준 분배 (최대 8명)</h2>
  <div id="timeInputs"></div>
  <button onclick="addTimeRow()">+ 사람 추가</button>
  <div id="timeResult" class="result"></div>
</section>

<script>
const percentInputs = document.getElementById("percentInputs");
const timeInputs = document.getElementById("timeInputs");

for (let i = 0; i < 5; i++) {
  percentInputs.innerHTML += `
    <input type="number" inputmode="decimal" placeholder="퍼센트 ${i+1} (%)" />
  `;
}

let timeCount = 0;
function addTimeRow() {
  if (timeCount >= 8) return;
  timeInputs.innerHTML += `
    <input type="number" inputmode="decimal" placeholder="사람 ${timeCount+1} 근무 시간" />
  `;
  timeCount++;
}

document.body.addEventListener("input", calculate);

function calculate() {
  const total = Number(totalTip.value) || 0;

  // 퍼센트 계산
  const percents = [...percentInputs.querySelectorAll("input")].map(i => Number(i.value) || 0);
  const percentSum = percents.reduce((a,b)=>a+b,0);
  percentResult.textContent = percentSum
    ? percents.map(p => ((total * p / percentSum).toFixed(2))).join(" / ")
    : "";

  // 사람 수 계산
  const people = Number(peopleCount.value) || 0;
  peopleResult.textContent = people ? (total / people).toFixed(2) : "";

  // 시간 계산
  const times = [...timeInputs.querySelectorAll("input")].map(i => Number(i.value) || 0);
  const timeSum = times.reduce((a,b)=>a+b,0);
  timeResult.textContent = timeSum
    ? times.map(t => ((total * t / timeSum).toFixed(2))).join(" / ")
    : "";
}
</script>

</body>
</html>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js?v=3");
  });
}
</script>
